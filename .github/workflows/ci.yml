name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: Pack and smoke-test the tarball
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/basitalisandhu-claude-perm-sim-*.tgz
          npx claude-perm-sim --version
          npx claude-perm-sim --help | head -1

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pack, install into an empty folder, run the quick start and compare with the README sample
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm pack
          awk '/^```text$/{f=1;next} f&&/^```$/{exit} f' README.md > "$RUNNER_TEMP/want.txt"
          mkdir -p "$RUNNER_TEMP/tool" && cd "$RUNNER_TEMP/tool"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/basitalisandhu-claude-perm-sim-*.tgz
          cp -R "$GITHUB_WORKSPACE/test/fixtures/readme-quickstart" "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          bin="$RUNNER_TEMP/tool/node_modules/.bin/claude-perm-sim"
          "$bin" load | grep -q "Bash(npm run \*)"
          "$bin" explain "Bash(git push origin main)" | grep -q "ask"
          set +e
          "$bin" bypass > bypass.txt
          code=$?
          set -e
          test "$code" = "0" -o "$code" = "1"
          "$bin" explain --from calls.txt > got.txt
          diff "$RUNNER_TEMP/want.txt" got.txt

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and run it on an empty project
        run: |
          docker build --build-arg VERSION=ci -t claude-perm-sim:ci .
          docker run --rm claude-perm-sim:ci --help > help.txt && grep "^Usage" help.txt
          docker run --rm claude-perm-sim:ci --version
          test "$(docker run --rm --entrypoint id claude-perm-sim:ci -u)" = "1000"
          mkdir -p "$RUNNER_TEMP/empty"
          docker run --rm -v "$RUNNER_TEMP/empty:/work:ro" claude-perm-sim:ci load > out.txt
          grep -q "allow" out.txt
